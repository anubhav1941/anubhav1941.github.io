projects:
  - id: railbook
    name: RailBook
    tagline: Train ticket booking as microservices, on Kubernetes
    context: M.Tech coursework, BITS Pilani (Scalable Services)
    problem: >-
      Two people press Book on the last seat at the same moment. Exactly one of them should get it,
      even with several replicas of each service and a network that drops calls.
    built:
      - >-
        Two FastAPI services, inventory and booking, each owning its own PostgreSQL deployed as a
        StatefulSet.
      - >-
        A booking saga: hold seats, take payment, confirm; on any failure, compensate by releasing
        the seats.
      - >-
        No overbooking: seat holds lock the schedule row (SELECT … FOR UPDATE), so concurrent
        requests on any replica can't sell the same seat twice.
      - >-
        Resilient calls: 3-second timeouts and 3 retries with exponential backoff, made safe by
        using the PNR as an idempotency key.
      - >-
        Probes, resource limits, ConfigMaps and Secrets; an HPA scales inventory from 2 to 5 pods
        under load.
      - GitHub Actions tests each service and pushes its image to Docker Hub.
    stack: [Kubernetes, FastAPI, PostgreSQL, Docker, GitHub Actions, HPA]
    diagram: railbook
    links:
      - {label: railbook-deploy, url: "https://github.com/anubhav1941/railbook-deploy"}
      - {label: inventory-service, url: "https://github.com/anubhav1941/inventory-service"}
      - {label: booking-service, url: "https://github.com/anubhav1941/booking-service"}

  - id: terraform
    name: AWS infrastructure with Terraform
    tagline: One codebase, dev and prod, with locked remote state
    context: Personal project
    problem: >-
      Hand-built cloud environments drift apart, and two people running terraform apply at once
      can corrupt shared state.
    built:
      - Reusable network and compute modules; dev and prod are thin wrappers with their own CIDRs and sizes.
      - >-
        Remote state in S3 (versioned, encrypted, TLS-only) with DynamoDB locking, both created by
        a small bootstrap stack.
      - >-
        Hardened EC2: latest Amazon Linux 2023, IMDSv2 required, encrypted gp3, shell through SSM
        Session Manager instead of an open port 22.
      - >-
        CI on every push: fmt, validate, tflint, and terraform test suites that mock the AWS
        provider, so security rules are checked without an AWS account.
      - Root-caused orphaned route tables left by a partial destroy, and documented the fix.
    stack: [Terraform, AWS VPC, EC2, S3, DynamoDB, IAM, GitHub Actions]
    diagram: terraform
    links:
      - {label: terraform-aws-infra, url: "https://github.com/anubhav1941/terraform-aws-infra"}

  - id: easyshop
    name: GitOps on AWS EKS
    tagline: From git push to a live HTTPS app, with no kubectl apply
    context: >-
      Guided build of TrainWithShubham's open-source EasyShop app; I deployed and debugged it end
      to end
    problem: >-
      Ship a three-tier app so that a commit is the only manual step: build, publish, deploy and
      TLS all follow from git.
    built:
      - Terraform for the VPC, EKS cluster, worker nodes and a bastion host.
      - >-
        Jenkins pipeline on a GitHub webhook: build the image, push to Docker Hub, then bump the
        image tag in the manifests through a shared library.
      - ArgoCD watches the manifests and auto-syncs 13 resources into the cluster.
      - >-
        NGINX Ingress with cert-manager issuing Let's Encrypt certificates; MongoDB as a
        StatefulSet; an HPA from 2 to 5 replicas at 70% CPU; a migration Job.
      - >-
        Debugged Docker socket permissions on the Jenkins host and a TLS certificate stuck on the
        ACME HTTP-01 challenge (DNS propagation).
    stack: [AWS EKS, Terraform, Jenkins, ArgoCD, NGINX Ingress, cert-manager, MongoDB]
    diagram: easyshop
    links:
      - {label: devops-3tier-ecommerce-pipeline, url: "https://github.com/anubhav1941/devops-3tier-ecommerce-pipeline"}

