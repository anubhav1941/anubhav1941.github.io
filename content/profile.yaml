scale:
  kicker: The system I work on
  title: Passenger Reservation System, Indian Railways
  intro: >-
    At CRIS (Centre for Railway Information Systems, Ministry of Railways) I'm on the platform
    team behind PRS, the system that reserved train tickets across India go through, whether
    they're booked at a station counter, on IRCTC or in an app.
  stats:
    - value: "1M+"
      label: transactions per second at Tatkal peaks
      note: One million every second, about 6 crore a minute.
    - value: "11,000+"
      label: trains on the system
      note: Every reserved seat and berth on them is sold through PRS.
    - value: "2 DCs"
      label: Active-Active disaster recovery
      note: Both data centres serve live traffic; either can carry the load.
    - value: "1.5 lakh+"
      label: bookings a minute, the upgraded PRS's design target
      note: Up from 32,000, with 40 lakh+ enquiries a minute.
      source:
        label: PIB, Aug 2026
        url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/aug/doc202686945401.pdf
  tatkal: >-
    Tatkal is the daily window when last-minute tickets go on sale. Demand arrives in the
    first seconds, so the whole stack has to absorb a spike that is many times normal load.
  work_title: What I do there
  work:
    - title: GitOps delivery
      text: ArgoCD deployments with Helm and Kustomize overlays for Java microservices on OpenShift.
    - title: Observability
      text: >-
        Prometheus and Grafana dashboards with alert thresholds for JVM heap and native memory,
        replication lag and cluster health.
    - title: Percona XtraDB Cluster
      text: >-
        Galera cluster on OpenShift via the Percona Operator: replication and GTID consistency,
        ProxySQL routing and hostgroups, and DC-to-DR failover checks against runbooks.
    - title: Aerospike Enterprise
      text: >-
        Bare-metal RHEL 9 clusters: health and partition monitoring with asadm, XDR replication
        checks, and backup and restore to S3-compatible storage.
    - title: Hazelcast Enterprise
      text: >-
        In-memory data grid across DC and DR: IMap utilisation, WAN replication queues,
        near-cache behaviour and CP Subsystem locks.

